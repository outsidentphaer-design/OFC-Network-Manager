name: Deploy OFC Network Manager\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm install\n      - run: npm run build\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./dist\n      - id: deployment\n        uses: actions/deploy-pages@v4\n